<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <form>
        <h2>Caderno de questão</h2>

        <label for="questao">Digite a questão:</label>
        <input type="text" id="questao" name="questao">

        <h2>Disciplinas</h2>

        <select name="disciplina">
            <option value="portugues">Português</option>
            <option value="administrativo">Direito Administrativo</option>
            <option value="rlm">Raciocínio Lógico</option>
        </select>

        <h3>Motivo do erro:</h3>

        <div class="motivos">
            <label>
                <input type="radio" name="motivo_erro" value="nao_sabia">
                Não sabia
            </label>

            <label>
                <input type="radio" name="motivo_erro" value="esqueci">
                Esqueci
            </label>

            <label>
                <input type="radio" name="motivo_erro" value="interpretacao">
                Interpretação
            </label>

            <label>
                <input type="radio" name="motivo_erro" value="desatencao">
                Desatenção
            </label>

            <label>
                <input type="radio" name="motivo_erro" value="confusao">
                Confusão entre conceitos
            </label>

            <label>
                <input type="radio" name="motivo_erro" value="calculo">
                Erro de cálculo
            </label>

            <label>
                <input type="radio" name="motivo_erro" value="chute">
                Chute
            </label>
        </div>

        <button type="submit">Salvar erro</button>
    </form>
   <section id="tabela_de_questao">

    <h2>Questões mais erradas</h2>

    <table border="1">

        <thead>
            <tr>
                <th>Questão</th>
                <th>Enunciado</th>
                <th>Disciplina</th>
                <th>motivo</th>
                <th>Erros</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>Enunciado da questão...</td>
                <td>Português</td>
                <td>Esqueci</td>
                <th>10</th>
            </tr>

            <tr>
                <td>2</td>
                <td>Enunciado da questão...</td>
                <td>Raciocínio Lógico</td>
                <td>Não sabia</td>
                <th>1</td>
            </tr>

        </tbody>

    </table>

    </section>
</body>
</html>
